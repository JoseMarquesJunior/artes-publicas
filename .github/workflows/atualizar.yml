name: Atualizar dados do PNCP

on:
  schedule:
    - cron: "0 6 * * *" # todo dia às 06:00 UTC (03:00 em Brasília)
  workflow_dispatch:
    inputs:
      dias:
        description: "Quantos dias para trás buscar (padrão 2). A API aceita ~30 req/min: 2 dias ≈ 8 min, 30 dias ≈ 2 h."
        required: false
        default: "2"
      ate:
        description: "Data final (AAAA-MM-DD). Vazio = hoje. Use para dividir a carga inicial em partes de 30 dias."
        required: false
        default: ""
      fontes:
        description: "Só estas fontes, separadas por vírgula (ex.: querido-diario,mapas:nova-lima). Vazio = todas as ativas."
        required: false
        default: ""
      reclassificar:
        description: "Reenviar à IA todos os itens S e D (custa centavos; use após mudar o prompt)."
        type: boolean
        required: false
        default: false

permissions:
  contents: write

concurrency:
  group: atualizar-dados
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Preparar Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Coletar oportunidades (PNCP + Mapas Culturais) e classificar
        # No cron os inputs são nulos: cai em 2 dias e sem --ate.
        # A chave da Anthropic vem de um segredo do repositório; sem ela a coleta roda e marca os itens como "pendente".
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/fetch.mjs --dias ${{ inputs.dias || 2 }} ${{ inputs.ate && format('--ate {0}', inputs.ate) || '' }} ${{ inputs.fontes && format('--fontes {0}', inputs.fontes) || '' }} ${{ inputs.reclassificar == true && '--reclassificar' || '' }}

      - name: Commitar dados se houve mudança
        run: |
          if git diff --quiet -- docs/data; then
            echo "Nenhuma mudança em docs/data; nada a commitar."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs/data
          git commit -m "dados: atualização automática $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
