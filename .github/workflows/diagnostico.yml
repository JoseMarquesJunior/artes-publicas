name: Diagnóstico de acesso às fontes (temporário)

on:
  workflow_dispatch:

jobs:
  diagnostico:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Testar acesso às APIs do Mapas Culturais a partir do runner
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36"
          Q='/api/opportunity/find?@select=id&@limit=1'
          for base in https://mapaculturalbh.pbh.gov.br https://mapacultural.lagoasanta.mg.gov.br https://mapacultural.novalima.mg.gov.br https://mapas.cultura.gov.br; do
            echo "== $base"
            printf 'A) curl, UA navegador, Accept json:           '; curl -s -o /dev/null -w "%{http_code} (http/%{http_version})\n" -A "$UA" -H "Accept: application/json" "$base$Q"
            printf 'B) curl, cabeçalhos completos de navegação:    '; curl -s -o /dev/null -w "%{http_code}\n" -A "$UA" -H "Accept: text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8" -H "Accept-Language: pt-BR,pt;q=0.9,en;q=0.8" -H 'sec-ch-ua: "Chromium";v="130", "Google Chrome";v="130", "Not?A_Brand";v="99"' -H "sec-ch-ua-mobile: ?0" -H 'sec-ch-ua-platform: "Windows"' -H "Sec-Fetch-Dest: document" -H "Sec-Fetch-Mode: navigate" -H "Sec-Fetch-Site: none" -H "Sec-Fetch-User: ?1" -H "Upgrade-Insecure-Requests: 1" "$base$Q"
            printf 'C) curl, XHR com Referer da própria instância:  '; curl -s -o /dev/null -w "%{http_code}\n" -A "$UA" -H "Accept: application/json, text/plain, */*" -H "Accept-Language: pt-BR,pt;q=0.9" -H "Referer: $base/oportunidades/" -H "Origin: $base" -H "X-Requested-With: XMLHttpRequest" -H "Sec-Fetch-Dest: empty" -H "Sec-Fetch-Mode: cors" -H "Sec-Fetch-Site: same-origin" "$base$Q"
            printf 'D) curl, HTTP/1.1 forçado:                     '; curl -s -o /dev/null -w "%{http_code}\n" --http1.1 -A "$UA" -H "Accept: application/json" "$base$Q"
            printf 'E) página inicial (HTML):                      '; curl -s -o /dev/null -w "%{http_code}\n" -A "$UA" "$base/"
            printf 'F) corpo do bloqueio (A):                      '; curl -s -A "$UA" -H "Accept: application/json" "$base$Q" | sed 's/<[^>]*>/ /g' | tr -s ' \n' | head -c 160; echo
          done
          echo "== IP de saída do runner"; curl -s https://api.ipify.org; echo
